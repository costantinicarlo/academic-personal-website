project:
  type: website
  output-dir: _site

website:
  title: "Carlo Costantini"

  description: >-
    Evolutionary ecology, mosquito biology, and quantitative approaches to understanding organism–environment interactions.

  favicon: images/favicon.png
  
  navbar:
    logo: images/avatar.png
    logo-alt: "Carlo Costantini"
    # Use Quarto's default homepage link for both the logo and site title.

    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
      - text: Research
        href: research/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: Resources
        href: resources/index.qmd
      - text: Notes
        href: notes/index.qmd
      - text: Gallery
        href: gallery/index.qmd

  # Draft landing pages stay out of published navigation and search.
  draft-mode: gone

  search:
    location: navbar
    type: overlay

  back-to-top-navigation: true

  page-footer:
    left:
      - text: "© 2026 Carlo Costantini · Copyright and reuse"
        href: rights.qmd

    center:
      - text: "MIVEGEC"
        href: https://mivegec.fr/fr/annuaire/agent?id=273
      - text: "ORCID"
        href: https://orcid.org/0000-0003-1016-129X
      - icon: github
        href: https://github.com/costantinicarlo

    right: "Last edited: {{< meta date-modified >}}"

    border: true

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    citations-hover: true
    footnotes-hover: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto

lang: en-GB

bibliography: bibliography/references.bib
csl: bibliography/csl/apa.csl
