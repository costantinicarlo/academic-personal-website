        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);

## La question de recherche
</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="block">

Une température de l’air plus élevée augmente-t-elle le nombre de moustiques attaquant un hôte ?
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>
</div>

<aside class="notes"><p>Dans un contexte de préoccupations concernant le changement climatique et les maladies vectorielles, des chercheurs étudient la température nocturne et la pression des moustiques. Cette pression désigne ici le nombre de moustiques tentant de piquer un hôte, et non le nombre de piqûres réussies.</p>
</aside></script></section><section data-separator="?

## L’objectif de l’étude
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

</div>


</div>

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Les chercheurs souhaitent estimer l’effet causal de la température nocturne sur la pression des moustiques.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

<div class="block">

Pression = abondance par hôte des moustiques attaquants tentant de piquer, et non le nombre de piqûres réussies.
</div>



</div>
</div>

<aside class="notes"><p>La question visée concerne un effet écologique. Une régression des comptages disponibles sur la température n’y répond pas automatiquement. <strong>Les conséquences possibles pour la transmission motivent l’étude, mais ne sont pas mesurées directement.</strong></p>

## Les moustiquaires comme pièges
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="block">

<img src="assets/storyline/storyline_03.png" alt="Des moustiques entrent dans une moustiquaire usée par ses ouvertures" style="object-fit: scale-down">

</div>


</div>

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Les moustiquaires usées et non imprégnées piègent certains moustiques. Les chercheurs supposent que ces comptages reflètent la pression des moustiques.

> [!danger]
> Les conséquences pour la transmission motivent l’étude, mais ne sont pas mesurées directement.

</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

<div class="block">

Faute de budget, les scientifiques n’ont pas pu s’offrir des dispositifs d’échantillonnage *proactif*.
</div>



</div>
</div>

<aside class="notes"><p>Sous contrainte budgétaire, les chercheurs choisissent un échantillonnage passif avec les moustiquaires existantes. Les moustiques peuvent entrer par des trous, des fentes ou d&#39;autres ouvertures et rester à l’intérieur jusqu’au matin. La proportionnalité entre comptages et attaquants est une hypothèse du modèle fictif de mesure, pas une mesure validée du risque de transmission. Chaque attaquant entre indépendamment dans une moustiquaire utilisée avec la probabilité <code>bed_net_entry_rate</code>, y reste et est compté le lendemain matin.</p>
</aside></script></section><section data-separator="?

## Qui entre dans l’échantillon ?
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

</div>


</div>

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Seules les maisons où quelqu’un a dormi sous une moustiquaire la nuit précédente sont échantillonnées.

> [!note]
> Posséder une moustiquaire ne rend pas la maison éligible.

</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>
</div>

<aside class="notes"><p>Chaque matin, l’équipe interroge les habitants sur l’utilisation effective, indépendamment de la possession d’une moustiquaire. <strong>Aucun comptage n’est enregistré lorsqu’elle n’a pas été utilisée.</strong></p>
</aside></script></section><section data-separator="?

</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="block">

L’équipe associe chaque comptage aux mesures de température de la nuit précédente.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>
</div>

<aside class="notes"><p>Des sondes de température sont installées dans les villages étudiés. La visite matinale permet de recueillir les comptages et les températures de la nuit précédente. La simulation simplifie ensuite le dispositif en observations maison-nuit indépendantes ; <strong>elle ne modélise ni les visites répétées ni le regroupement par village</strong>.</p>
</aside></script></section><section data-separator="?

</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Dans les maisons échantillonnées, les nuits plus chaudes sont associées à des comptages plus élevés.

> [!evidence]
> L’association ajustée décrit les données sélectionnées.

</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>
</div>

<aside class="notes"><p>Les chercheurs régressent les comptages sur la température. L’association ajustée décrit les données sélectionnées. Ils l’interprètent comme un effet causal sans examiner comment les maisons sont entrées dans l’échantillon.</p>

FENCEDCODEmermaid:1:YGBgbWVybWFpZAolJXtpbml0OiB7InRoZW1lVmFyaWFibGVzIjogeyJmb250RmFtaWx5IjogIkFyaWFsLCBzYW5zLXNlcmlmIiwgImZvbnRTaXplIjogIjI0cHgifSwgImZsb3djaGFydCI6IHsiaHRtbExhYmVscyI6IGZhbHNlLCAidXNlTWF4V2lkdGgiOiBmYWxzZSwgInBhZGRpbmciOiAyNH0sICJodG1sTGFiZWxzIjogZmFsc2UsICJmb250RmFtaWx5IjogIkFyaWFsLCBzYW5zLXNlcmlmIiwgImZvbnRTaXplIjogMjQsICJ0aGVtZUNTUyI6ICIubGFiZWwsIHRleHQsIHRzcGFuIHsgZm9udC1mYW1pbHk6IEFyaWFsLCBzYW5zLXNlcmlmOyBmb250LXNpemU6IDI0cHg7IH0ifX0lJQpmbG93Y2hhcnQgVEIKQVtUZW1ww6lyYXR1cmUgZGUgbOKAmWFpcl0gLS0+fHLDqWR1aXQgbGEgcHJvYmFiaWxpdMOpfCBDW1V0aWxpc2F0aW9uIGRlIGxhIG1vdXN0aXF1YWlyZV0KQltQcmVzc2lvbiBkZXMgbW91c3RpcXVlc10gLS0+fGF1Z21lbnRlIGxhIHByb2JhYmlsaXTDqXwgQwpzdHlsZSBDIGZpbGw6I2UyZjBlZCxzdHJva2U6IzBiNmI2MyxzdHJva2Utd2lkdGg6M3B4LGNvbG9yOiMxODIxMmEKYGBgECODDECNEF

Un **collisionneur** est une variable vers laquelle convergent deux flèches.
</div>

<aside class="notes"><p>La température et la pression agissent en sens opposés sur la même décision comportementale. Leurs effets sur cette décision n’impliquent pas un effet causal de la température sur la pression. Les deux variables causent l’utilisation. <strong>La seule présence d’un collisionneur dans le graphe ne crée pas l’association</strong> : la sélection sur ce nœud, ou sur l’un de ses descendants, ouvre le chemin. <em>Référence</em> : <a href="https://www.dagitty.net/learn/dsep/">https://www.dagitty.net/learn/dsep/</a></p>
</aside></script></section><section data-separator="?

Sélectionner les maisons échantillonnées revient à conditionner sur un **descendant du collisionneur**.

Ici, une maison est échantillonnée si et seulement si sa moustiquaire a été utilisée.
</div>

<aside class="notes"><p>Le nœud mis en évidence indique la restriction qui définit le jeu de données. Dans la simulation, <code>house_sampled</code> est exactement égal à <code>bednet_used</code> : sélectionner les maisons échantillonnées revient donc à sélectionner les utilisateurs. Plus généralement, <strong>conditionner sur un descendant du collisionneur peut aussi ouvrir le chemin</strong>. Référence : <a href="https://www.dagitty.net/learn/dsep/">https://www.dagitty.net/learn/dsep/</a></p>

La flèche en pointillés indique la disponibilité, et non un effet écologique. <!-- .element: class="source" -->

<aside class="notes"><p><strong>Ce schéma réunit processus écologique et observation.</strong> Le lien pointillé de disponibilité ne doit pas être interprété comme une flèche causale écologique ordinaire. Un comptage potentiel pourrait être défini pour chaque observation, mais il n’est enregistré que pour les maisons sélectionnées. Dans le modèle simplifié, la pression détermine son espérance.</p>

<!-- .slide: class="takeaway-slide" -->

EXPLICATION VERBALE <!-- .element: class="eyebrow" -->

## Sélectionner les utilisateurs crée une association

- Par nuit chaude, les maisons où la nuisance est faible ont moins de chances d’entrer dans l’échantillon.
- Celles où la nuisance est forte restent plus souvent représentées malgré la chaleur.
- ***Chez les utilisateurs de moustiquaires*, les nuits chaudes peuvent donc *sembler* compter davantage de moustiques.**

Nous évaluons ensuite ces explications quantitativement.
</div>

<aside class="notes"><p><strong>Il s’agit d’un biais de sélection sur un collisionneur.</strong> L’exemple montre une association qui apparaît après sélection, plutôt qu’une inversion d’une association substantielle préexistante. <strong>Son signe positif découle du modèle comportemental choisi ; un biais de collisionneur n’a pas toujours ce signe.</strong></p>
<p>Faire prédire les tendances dans la population et l’échantillon avant de montrer les résultats.</p>
</aside></script></section><section data-separator="?

# Simuler le monde
</div>

<aside class="notes"><p>Déroulement d’une démonstration : demander des prédictions ; montrer les hypothèses écologiques et comportementales ; présenter la population avant l’échantillon ; puis modifier un paramètre comportemental et relancer, si souhaité dans une copie de travail distincte. Garder le processus écologique fixe pour étudier la sélection.</p>
</aside></script></section><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Le mécanisme de génération des données

Nous simulons 6 000 maisons-nuits indépendantes.

1. Générer indépendamment la température et la pression des moustiques.
2. Générer l’utilisation des moustiquaires selon la température et la nuisance.
3. Échantillonner uniquement les maisons où la moustiquaire est utilisée.
4. Simuler les entrées dans la moustiquaire par une loi binomiale de probabilité.

**L’effet réel de la température sur la pression est exactement nul.**
</div>

<aside class="notes"><p>Les objets R nomment ces observations <code>houses</code>. Le modèle représente une nuit par maison simulée, <strong>sans mesures répétées ni effets de village</strong>. Les coefficients sont illustratifs et ne sont pas estimés sur le terrain.</p>
</aside></script></section><section ><section data-separator="?

## Standardiser pour le modèle comportemental

FENCEDCODEr:1:YGBgcgp0eiA8LSBhcy5udW1lcmljKHNjYWxlKGFpcl90ZW1wZXJhdHVyZV9jKSkKbXogPC0gYXMubnVtZXJpYyhzY2FsZSh0cnVlX2F0dGFja2luZ19tb3NxdWl0b2VzKSkKYGBgECODDECNEF

- **Unités communes :** moyenne 0 et écart-type 1.
- **Variations comparables :** chaque coefficient décrit une hausse d’un écart-type.
- **Référence interprétable :** la constante correspond à une température et une pression moyennes.
</div>

<aside class="notes"><p>Standardiser consiste à soustraire la moyenne et à diviser par l’écart-type de l’échantillon : <code>z = (x - mean(x)) / sd(x)</code>. Les noms <code>tz</code> et <code>mz</code> désignent respectivement température et pression standardisées dans tous les scripts. Dans le modèle logistique suivant, −1,25 est la variation du logit de la probabilité d’utilisation pour une hausse d’un écart-type de température, à pression constante ; +1,75 est la variation correspondante pour la pression. La constante −1 est le logit de la probabilité d’utilisation lorsque la température et la pression sont à leur moyenne. La standardisation peut améliorer le conditionnement numérique lorsque les échelles diffèrent, mais n’est pas obligatoire pour une régression logistique. Elle ne rend pas les comptages asymétriques normaux, ne supprime pas la confusion et ne corrige pas la sélection.</p>
<p>Exécuter les diapositives de code dans l’ordre : cette étape transforme les vecteurs générés précédemment. Aucun jeu de données pré-calculé n’est nécessaire.</p>
</aside></script></section><section data-separator="?

La standardisation ne change pas la corrélation de Pearson.

<aside class="notes"><p>Les variables sont indépendantes par construction : leurs processus de génération ne partagent ni entrées ni liens causaux. Le nuage de points et le test recherchent une association linéaire dans la réalisation simulée ; ils ne prouvent pas l’indépendance. Une zone carrée, des limites communes et <code>asp = 1</code> assurent la même étendue et le même espacement physique par écart-type sur les deux axes. La standardisation est facultative pour Pearson : $r$, la statistique du test, l’intervalle de confiance et la valeur $p$ restent inchangés. Le diagnostic porte sur les 6 000 observations générées, avant toute restriction aux utilisateurs.</p>

<aside class="notes"><p>Les lignes orange sont des ajustements par moindres carrés. Le panneau standardisé utilise les mêmes limites, graduations et espacements sur les deux axes, sans tronquer <code>tz</code> ni <code>mz</code>. La standardisation conserve la corrélation ; l’apparence change lorsque les axes partagent une échelle commune. L’hypothèse nulle est une corrélation de Pearson nulle dans la population ; l’alternative est une corrélation non nulle. Le test $t$ et l’intervalle fondé sur la transformation $z$ de Fisher reposent sur des hypothèses de distribution pour une inférence exacte ou approchée. Les comptages sont ici discrets et asymétriques : considérer ces résultats comme un diagnostic sur grand échantillon, pas comme un test exact d’indépendance. Une valeur $p$ non significative n’établit pas un effet nul. L’indépendance est connue par le plan de simulation.</p>

À température et pression moyennes (`tz = mz = 0`), **−1 est le logit de la probabilité d’utilisation**, soit **26,9 % d’utilisation**.

La chaleur réduit l’utilisation (`-1.25 * tz`) ; la nuisance l’augmente (`+1.75 * mz`).

L’*utilisation* effective pour chaque maison-nuit est tirée d’un processus binomial.
</div>

<aside class="notes"><p><code>tz</code> et <code>mz</code> sont la température et la pression standardisées. Lorsqu’elles valent zéro, le prédicteur égale la constante : <code>-1 = log(p / (1 - p))</code>. L’inverse du logit donne <code>p = plogis(-1) = 0.2689</code>. Il s’agit de la probabilité conditionnelle aux moyennes des deux variables indépendantes, pas de la probabilité moyenne parmi les maisons : l’inverse du logit est non linéaire. Les coefficients donnent la variation du logit de la probabilité d’utilisation pour une hausse d’un écart-type, l’autre variable indépendante étant fixée. <strong><code>rbinom</code> simule l’utilisation effective, pas la possession ni l’attribution d’une moustiquaire.</strong> La dernière ligne applique exactement la règle d’échantillonnage.</p>
</aside></script></section><section data-separator="?

<aside class="notes"><p>C’est la règle de mesure de <code>R/01_simulate.R</code>. Conditionnellement à $N$ attaquants, le comptage suit $\text{Binomiale}(N, p)$, avec <code>p = bed_net_entry_rate = 0.7</code> : espérance $Np$ et variance $Np(1-p)$. Zéro attaquant implique zéro capture, et les captures ne dépassent jamais les attaquants. La probabilité est illustrative et constante entre maisons et températures. Les entrées sont indépendantes et chaque entrant reste à l’intérieur et est compté. Cela ajoute une variabilité par rapport à un comptage parfait, mais pas nécessairement davantage de variance que l’ancien modèle de mesure de Poisson.</p>

## Script R : les trois régressions

FENCEDCODEr:1:YGBgcgojIFV0aWxpc2VyIGxlcyB2ZWN0ZXVycyBldCBs4oCZaW5kaWNhdGV1ciBnw6luw6lyw6lzIHByw6ljw6lkZW1tZW50CmZpdF9mdWxsICAgICAgICA8LSBsbSh0cnVlX2F0dGFja2luZ19tb3NxdWl0b2VzICAgICB+IGFpcl90ZW1wZXJhdHVyZV9jKQoKZml0X3NhbXBsZV90cnVlIDwtIGxtKHRydWVfYXR0YWNraW5nX21vc3F1aXRvZXMgICAgIH4gYWlyX3RlbXBlcmF0dXJlX2MsIHN1YnNldCA9IHNhbXBsZWQpCgpmaXRfb2JzZXJ2ZWQgICAgPC0gbG0obW9zcXVpdG9lc19jb3VudGVkX2luc2lkZV9uZXQgfiBhaXJfdGVtcGVyYXR1cmVfYywgc3Vic2V0ID0gc2FtcGxlZCkKYGBgECODDECNEF

Le modèle intermédiaire isole la sélection avant l’entrée partielle.

La régression *linéaire* résume l’association de manière transparente ; passer à une régression de comptage (GLM) ne supprimerait pas, à lui seul, le biais de sélection.
</div>

<aside class="notes"><p>Ce sont les trois modèles de <code>R/02_analyse.R</code>. Le modèle de population est une comparaison de référence accessible grâce à la simulation.</p>

## L’association apparaît lors de la sélection
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="block">

La sélection crée une pente positive chez les attaquants.

L’entrée partielle réduit la pente des comptages, tout en préservant l’association.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>

<aside class="notes"><p>Lire de haut en bas : tous les attaquants réels, les attaquants sélectionnés, puis les comptages sélectionnés. Les barres sont des intervalles de confiance à 95 %. <strong>La première comparaison isole la sélection ; la seconde introduit l’entrée binomiale.</strong> Avec une probabilité constante $p$, l’espérance de la pente des comptages, conditionnelle aux attaquants et températures sélectionnés, vaut $p$ fois leur pente. La pente réalisée fluctue autour de cette espérance. <strong>Les pentes sont dans les unités de comptage d’origine.</strong></p>
</aside></script></section><section data-separator="?

</div>


</div>

<div class="block">

Une régression peut décrire **correctement** l’échantillon observé **sans répondre** à la question écologique.
</div>


</div>

<div class="fn-column" style="position: absolute; left: 53%; top: 19%; height: 67%; width: 43%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Comprendre **comment les observations sont entrées dans le jeu de données** est ici essentiel pour interpréter la pente.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>









<br>
La régression linéaire est naïve mais honnête ; l’association naît du biais de sélection sur un collisionneur. <!-- .element: class="lead" -->
</div>

<aside class="notes"><p><strong>Le problème précède l’ajustement du modèle.</strong> Ajouter l’utilisation comme variable indépendante ne rétablit pas la comparaison manquante dans un échantillon où tout le monde utilise une moustiquaire. Ce tutoriel ne prétend pas que tout problème de sélection possède une correction statistique simple.</p>
</aside></script></section><section data-separator="?

## Questions à explorer

| Question | Modification à explorer |
|---|---|
| 1. Et si tout le monde utilisait une moustiquaire ? | Imposer l’utilisation dans toutes les maisons |
| 2. Et si la chaleur n’agissait plus sur l’utilisation ? | Annuler le coefficient de température |
| 3. Et si la nuisance n’agissait plus sur l’utilisation ? | Annuler le coefficient de pression |
| 4. Et si l’utilisation de référence changeait ? | Faire varier `baseline_logit` |
| 5. Et si davantage de moustiques entraient ? | Faire varier `bed_net_entry_rate` |
| 6. Et si la température affectait la pression ? | Ajouter un effet écologique direct |

Prédire d’abord ; modifier une seule hypothèse à la fois.

> [!note]
> Une intervention imposant l’utilisation universelle [Q1] diffère d’une augmentation de la constante d’utilisation [Q4].
</div>

<aside class="notes"><p>Descendre pour les réponses, puis aller à droite pour la question suivante. La question 1 compare une population fixe et des populations renouvelées ; les questions 2–6 utilisent uniquement la seconde approche. La question 6 apparie les régimes d’observation séparément pour chaque effet écologique. Pour les questions 2–5, chaque répétition génère une nouvelle population de 6 000 maisons-nuits, puis applique tous les scénarios à cette même population. Les variantes d’entrée conservent les maisons sélectionnées par le scénario de référence de cette répétition. <strong>Les points sont les moyennes ; les barres sont les plages centrales à 95 % de Monte-Carlo sur 200 répétitions, et non des intervalles de confiance.</strong></p>

Sous les hypothèses de cette simulation, que deviendrait la pente si toutes les maisons utilisaient une moustiquaire et étaient échantillonnées ? <!-- .element: class="lead" -->

Faire une pause et prédire avant de révéler la réponse.

<aside class="notes"><p>Garder les modèles écologique et de mesure fixes. <strong>L’utilisation universelle est ici une intervention imposée</strong> au modèle simplifié, <strong>pas une simple hausse de la constante</strong> ni une prédiction des effets réels d’une couverture universelle.</p>
</aside></script></section><section data-separator="?

<aside class="notes"><p>Le graphe représente l’intervention : imposer U = 1 supprime les deux flèches entrantes, T → U et M → U. L’échantillonnage égale l’utilisation et devient constant pour tous ; aucune restriction sélective n’ouvre donc de chemin entre T et M. Les nœuds déconnectés préservent l’indépendance écologique supposée. <strong>Le modèle inchangé de mesure pression–capture est omis pour la lisibilité.</strong> L’utilisation universelle supprime la sélection. Pour cette population écologique finie et fixe, la pente attendue des comptages vaut 0,7 fois la petite pente réalisée des attaquants, soit environ 0,082, et non exactement zéro. <strong>L’intervalle de simulation n’a donc pas à contenir zéro : il représente l’aléa de capture conditionnel à cette population, pas des populations écologiques répétées.</strong> Les points sont les moyennes ; les barres couvrent les 95 % centraux de 200 répétitions d’observation/capture, et ne sont ni des intervalles de confiance ni des tests. Cette première comparaison conserve la population ; la diapositive suivante la renouvelle. <code>R/04_discussion.R</code> régénère les simulations sans lire de données pré-calculées ; <code>R/05_make_french_plots.R</code> produit les graphiques français.</p>

## 3. Et si la nuisance n’agissait plus sur l’utilisation ?

Passer le coefficient de pression de **+1,75 à 0**, sans changer la température ni l’utilisation de référence.

Sélectionner uniquement les nuits fraîches créerait-il une association température–moustiques ? <!-- .element: class="lead" -->

Prédire la pente et la distribution des températures échantillonnées.

<aside class="notes"><p>Remplacer le terme de nuisance par 0 * mz, en gardant baseline_logit = -1 et le coefficient de température à -1.25. Régénérer le processus d’observation sur chaque population nouvellement générée. La sélection dépend désormais de la température, mais plus de la pression. Sous les hypothèses d’indépendance et de probabilité de capture constante, cela supprime le mécanisme de collisionneur. Les nuits fraîches restent surreprésentées, mais l’association attendue est nulle. Une plage de températures plus étroite peut modifier la précision. L’échantillon n’a pas besoin de représenter toutes les températures pour être exempt de ce biais particulier.</p>

## 6. Et si la température affectait la pression ?

Ajouter un **effet causal direct** de la température sur les moustiques attaquants, en conservant les deux influences sur l’utilisation des moustiquaires.

> [!question]
> La sélection des utilisateurs restitue-t-elle, amplifie-t-elle ou atténue-t-elle la relation écologique ?

Explorer un effet **négatif, nul, puis positif**.
</div>

<aside class="notes"><p>Cette question change le modèle causal. Une dépendance pourrait aussi résulter de causes environnementales communes ; ici, nous choisissons explicitement T → M. Les questions précédentes conservent leur hypothèse d’indépendance. L’utilisation ne modifie ni l’abondance des attaquants ni la probabilité d’entrée dans ce modèle simplifié ; elle détermine la disponibilité des comptages.</p>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Effet de la température sur la pression

FENCEDCODEr:1:YGBgcgp0ZW1wZXJhdHVyZV9lZmZlY3QgPC0gMC4zICAjIGJldGEKCm4gPC0gNjAwMEwKCmFpcl90ZW1wZXJhdHVyZV9jIDwtIHJub3JtKG4sIG1lYW4gPSAyNywgc2QgPSAyLjgpCgpsb2dfcHJlc3N1cmUgPC0gcm5vcm0obiwgbWVhbiA9IGxvZygyOCksIHNkID0gMC42NSkgKyB0ZW1wZXJhdHVyZV9lZmZlY3QgKiAoYWlyX3RlbXBlcmF0dXJlX2MgLSAyNykgLyAyLjgKCnRydWVfYXR0YWNraW5nX21vc3F1aXRvZXMgPC0gcnBvaXMobiwgbGFtYmRhID0gZXhwKGxvZ19wcmVzc3VyZSkpCmBgYA==ECODDECNEF

$N\\mid T,Z \\sim \\operatorname{Poisson}(\\lambda)$, donc $E[N\\mid T,Z]=\\lambda$.

$\\log(\\lambda)=\\log(28)+\\beta(T-27)/2.8+Z$, $Z\\sim N(0,0.65^2)$, $Z\\perp T$.

Ici, $T$ est la température en °C ; 27 et 2,8 sont la moyenne et l’écart-type **générateurs**.

$e^\\beta$ multiplie l’abondance attendue par hausse de 2,8 °C ; pour $\\beta=0{,}3$, cela donne **×1,35**.
</div>

<aside class="notes"><p>N désigne le nombre de moustiques attaquants et lambda sa moyenne conditionnelle. C’est N | T,Z qui suit une loi de Poisson ; E[N | T,Z] = lambda est une espérance, pas une variable tirée selon une loi de Poisson. Le code génère indépendamment la température et un terme normal de moyenne log(28) et d’écart-type 0.65, équivalent à log(28) + Z. Z représente l’hétérogénéité résiduelle entre maisons-nuits et est indépendant de T. Le coefficient temperature_effect correspond à beta. Le centrage et la division utilisent les paramètres fixes 27 et 2.8, pas la moyenne et l’écart-type réalisés dans cet échantillon. Le multiplicateur exp(beta) est valable à Z fixé et après intégration sur sa distribution indépendante. La moyenne marginale conditionnelle à T vaut 28 * exp(beta * (T - 27) / 2.8 + 0.65^2 / 2) ; 28 n’est donc pas la moyenne des attaquants à 27 °C. Le code reproduit la partie écologique de generate_ecological_population() dans R/lib/ecological_effect_compute.R. L’exemple ne réinitialise pas la graine ; ses valeurs ne doivent pas nécessairement reproduire les figures à graine fixée. Après avoir régénéré les attaquants, recalculer tz et mz à partir des nouveaux vecteurs avant d’appliquer le modèle comportemental. Le générateur complet le fait automatiquement. Dans le modèle causal supposé, beta décrit un effet sur le logarithme de l’abondance attendue, pas la pente linéaire des comptages.</p>
</aside></script></section><section data-separator="?
---?
" data-separator-vertical="?

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

<aside class="notes"><p>À chaque valeur de l’effet, 200 populations indépendantes de 6 000 maisons-nuits sont générées. Dans chaque répétition, couverture universelle et utilisateurs partagent les mêmes captures, avec une probabilité d’entrée de 0,7. Les barres sont des plages centrales à 95 % de Monte-Carlo, pas des intervalles de confiance. La ligne verticale à zéro correspond au modèle écologique initial. Les points entre valeurs sont reliés pour guider la lecture. L’effet écologique agit sur le logarithme de l’abondance attendue par 2,8 °C ; la pente ajustée décrit des moustiques par °C. Leur différence numérique n’est donc pas une mesure de biais. Comparer plutôt les deux pentes de comptages. La standardisation mz est recalculée dans chaque population : la sensibilité à la nuisance reste constante par écart-type, pas par moustique. Modifier l’effet change aussi la distribution marginale de pression ; l’interception écologique maintient l’abondance attendue à 27 °C, pas sa moyenne marginale.</p>
</aside></script></section><section data-separator="?

## Comment mesurer la pression des moustiques indépendamment du choix d’utiliser une moustiquaire ?

1. Envisager d’échantillonner les maisons-nuits quel que soit l’usage de la moustiquaire, avec une méthode de mesure applicable aux deux groupes.
2. Consigner l’utilisation des moustiquaires et les raisons des observations manquantes.

> [!evidence] Preuves
> Observer l’utilisation aide à diagnostiquer la sélection, mais ne permet pas à elle seule de retrouver les comptages manquants ni de garantir une estimation causale sans biais.
</div>

<aside class="notes"><p>L’objectif est de rompre la dépendance de l’observation au collisionneur comportemental. Faire proposer et évaluer une méthode de mesure entomologique adaptée ; le diaporama ne valide aucun dispositif particulier.</p>

**Une cause commune peut créer une association.**

La saison peut agir sur la température et la pression, même sans effet direct de la température.

Nos modèles omettent ce chemin.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

Une étude réaliste doit examiner les chemins saisonniers en plus de la sélection.
</div>



</div>
</div>

<aside class="notes"><p>Ces modèles pédagogiques isolent certains mécanismes ; ils ne décrivent pas intégralement l’écologie des moustiques ni leur observation. La saison représente des processus saisonniers susceptibles d’influencer à la fois la température et la pression des moustiques. Ce chemin par une cause commune peut produire une association dans la population sans effet direct de la température sur la pression. La température peut aussi modifier le comportement des moustiques et leur probabilité d’entrée dans une moustiquaire. Si cette probabilité varie avec la température, les comptages peuvent dépendre de celle-ci même sous couverture universelle et sans effet sur l’abondance des attaquants. Dans le modèle simplifié, la couverture universelle supprime la sélection liée à l’utilisation ; elle ne supprime ni la confusion saisonnière ni la capture dépendante de la température. Une analyse réaliste doit préciser les processus saisonniers et les échelles temporelles, étudier l’efficacité de capture selon la température et examiner ces chemins à l’aide des connaissances de terrain, de données de calibration et d’analyses de sensibilité. La question 6 ajoute un effet écologique direct, mais omet encore ces deux chemins. Les simulations n’établissent ni leur présence ni leur ampleur sur le terrain.</p>

<aside class="notes"><p>Ce schéma réunit les mécanismes examinés séparément dans la présentation. La saison est une cause commune de la température et de la pression. La flèche T → M représente l’effet écologique direct à étudier ; sa présence et son ampleur ne sont pas établies ici, et le modèle sans effet l’omet. T → U ← M reste le collisionneur comportemental, l’échantillonnage étant déterminé par l’utilisation. La température agit aussi sur la probabilité d’entrée ; pression et entrée déterminent les captures potentielles. Le lien pointillé entre sélection et comptage indique si le comptage est enregistré : c’est un lien de disponibilité, pas un effet écologique sur l’abondance ni une assimilation des comptages manquants à zéro. Le nœud de sélection surligné indique la restriction définissant les données disponibles. Ce modèle causal et d’observation élargi n’inclut pas nécessairement tous les chemins pertinents : rétroactions, autres causes environnementales et hétérogénéité de mesure restent notamment à examiner. Les chemins saisonnier et d’entrée sont des extensions proposées, qui ne sont pas déjà ajustées ou simulées par les scripts actuels. Discuter des flèches soutenues par les connaissances de terrain et des données nécessaires pour identifier leurs effets. Un échantillonnage universel ne résoudrait à lui seul ni la confusion saisonnière ni la capture dépendante de la température.</p>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }
