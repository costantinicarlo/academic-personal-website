        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();

## The research question
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Does higher air temperature increase the number of mosquitoes attacking a host?
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">


</div>

<aside class="notes"><p>Against a background of concern about climate change and mosquito-borne diseases, researchers investigate nightly temperature and mosquito pressure.</p>
<p>Here, mosquito pressure means the number of mosquitoes attempting to bite a host, not the number of successful bites.</p>

## The study objective
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

The researchers aim to estimate the causal effect of nightly temperature on mosquito pressure.
</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

<div class="block">

Pressure = per host abundance of attacking mosquitoes attempting to bite, not the number of successful bites.
</div>



</div>
</div>

<aside class="notes"><p>Their intended question concerns an ecological effect. A regression of available counts on temperature will not automatically answer that question. <strong>Potential implications for transmission motivate the study but are not measured directly.</strong></p>

## Bed nets as sampling devices
</div>


</div>

<div class="fn-figure-area" style="position: absolute; left: 4%; top: 18%; height: 66%; width: 62%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">

</div>


</div>

<div class="fn-interpretation" style="position: absolute; left: 69%; top: 18%; height: 66%; width: 27%; display: flex; flex-direction: column; align-items: start; justify-content: flex-start" align="left">

<div class="block">

Worn, non-impregnated nets trap some mosquitoes. The researchers assume these counts reflect mosquito pressure.

> [!danger]
> Implications for transmission motivate the study but are not measured directly.

</div>


</div>

<div class="fn-template-source" style="position: absolute; left: 4%; top: 93%; height: 5%; width: 92%; display: flex; flex-direction: column; align-items: start; justify-content: flex-end" align="left">

<div class="block">

The scientists could not afford *active* sampling devices due to research grant budgetary constraints.
</div>



</div>
</div>

<aside class="notes"><p>The researchers choose passive sampling with existing bed nets under budget constraints. Mosquitoes can enter through holes, slits, or untucked openings and remain inside until morning.</p>
<p>Proportionality between trapped counts and attacking mosquitoes is an assumption of the fictional measurement model, not a validated measure of transmission risk.</p>
<p>The simulation assumes each attacker independently enters a used net with a constant probability <code>bed_net_entry_rate</code>, remains inside, and is counted the next morning.</p>
</aside></script></section><section data-separator="?

<!-- .slide: class="takeaway-slide" -->

VERBAL EXPLANATION <!-- .element: class="eyebrow" -->

## Selecting net users creates an association

- On hot nights, houses with low mosquito nuisance are less likely to enter the sample.
- Houses with high nuisance are more likely to remain represented despite the heat.
- ***Among net users*, hotter nights can therefore *appear* to have more mosquitoes.**

In what follows we assess these explanations quantitatively.
</div>

<aside class="notes"><p><strong>This is collider selection bias.</strong></p>
<p>The example shows an association emerging after selection, rather than a reversal of a substantive population association.</p>
<p><strong>Its positive direction follows from the particular behavioural model; collider bias does not always have this sign.</strong></p>
<p>Ask the audience to predict the population and selected-sample patterns before showing the results.</p>
</aside></script></section><section data-separator="?

## The data-generating mechanism

We simulate 6,000 *independent* house-nights.

1. Generate temperature and mosquito pressure independently.
2. Generate net use from temperature and mosquito nuisance.
3. Sample only records where a net was used.
4. Sample mosquito net entrants with a binomial model and entry probability.

**The true temperature effect on pressure is exactly zero.**
</div>

<aside class="notes"><p>The R objects call these records <code>houses</code>.</p>
<p><strong>This simple model represents one night per simulated house, without repeated measurements or village effects.</strong> Its chosen coefficients are illustrative, not estimates from field data.</p>
</aside></script></section><section ><section data-separator="?

All 6,000 house-nights before selection. Linear axes; bin widths: 1 °C and 10 mosquitoes. <!-- .element: class="caption" -->

<aside class="notes"><p>These histograms show the two vectors generated on the parent slide, before standardisation, selection or capture. Both axes are linear and the complete observed ranges are retained. Bar heights are frequencies, not probability densities; the different bin widths and units mean heights should not be compared directly across panels.</p>
<p>Temperature follows a normal generating distribution. Attackers follow a Poisson–lognormal mixture: each house-night has its own lognormally distributed Poisson mean, creating a right-skewed count distribution. The mixture is neither a single Poisson distribution nor a lognormal distribution of counts. The median of $\lambda$ is 28, while its mean is $28 \cdot e^{(0.65^2 / 2)}$.</p>
<p>Marginal histograms do not establish independence; that comes from the generating model, and the subsequent scatterplot examines the realised association.</p>
<p>Descend from the code slide to inspect these distributions, then return to the main sequence for standardisation. To reproduce interactively, use <code>hist(air_temperature_c)</code> and <code>hist(true_attacking_mosquitoes)</code>; <code>R/03_make_plots.R</code> specifies the displayed bin boundaries.</p>

## Standardise predictors for the behavioural model

FENCEDCODEr:1:YGBgcgp0eiA8LSBhcy5udW1lcmljKHNjYWxlKGFpcl90ZW1wZXJhdHVyZV9jKSkKCm16IDwtIGFzLm51bWVyaWMoc2NhbGUodHJ1ZV9hdHRhY2tpbmdfbW9zcXVpdG9lcykpCmBgYA==ECODDECNEF

- **Common units:** mean 0 and standard deviation 1.
- **Comparable changes:** each coefficient describes a one-SD increase.
- **Meaningful baseline:** the regression intercept refers to average temperature and pressure.
</div>

<aside class="notes"><p>Standardisation subtracts the mean and divides by the sample standard deviation: <code>z = (x - mean(x)) / sd(x)</code>. We use <code>tz</code> for standardised temperature and <code>mz</code> for standardised mosquito pressure throughout the model, analysis, and plotting scripts.</p>
<p>In the following logistic model, <strong>-1.25 is the change in log odds of net use for a one-SD temperature increase, holding mosquito pressure fixed</strong>; +1.75 is the corresponding change for pressure.</p>
<p>The intercept -1 is the log odds at both predictors&#39; means.</p>
<p><strong>Scaling can also improve numerical conditioning when predictors have disparate scales, but it is not required for logistic regression.</strong> It does not make skewed counts normal, remove confounding, or fix selection bias.</p>
<p>Run the code slides in order: this step scales the vectors generated on the preceding ecological-process slide. No pre-computed dataset is required.</p>
</aside></script></section><section data-separator="?

<aside class="notes"><p>The orange lines are least-squares fits. The standardised panel uses identical limits, tick marks, and unit spacing on both axes, covering the full range of <code>tz</code> and <code>mz</code> without clipping. Standardisation preserves Pearson correlation; the appearance changes when we give the axes a common scale. The null hypothesis is zero population Pearson correlation; the alternative is nonzero correlation.</p>
<p>The standard Pearson <em>t</em> test and Fisher-z confidence interval rely on distributional assumptions for exact or approximate inference. <strong>Mosquito counts here are skewed and discrete, so treat these conventional outputs as a large-sample diagnostic, not an exact independence test.</strong></p>

## R script: the behavioural filter

FENCEDCODEr:1:YGBgcgojIGF2ZXJhZ2UgdGVtcGVyYXR1cmUgYW5kIHByZXNzdXJlOiB0eiA9IDAsIG16ID0gMApiYXNlbGluZV9sb2dpdCA8LSAtMQoKcGxvZ2lzKGJhc2VsaW5lX2xvZ2l0KSAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIyBiYXNlbGluZSBuZXQtdXNlIHByb2JhYmlsaXR5OiAwLjI2OQoKbG9naXRfcF9uZXQgICAgICA8LSBiYXNlbGluZV9sb2dpdCAtIDEuMjUgKiB0eiArIDEuNzUgKiBteiAgIyBsaW5lYXIgcHJlZGljdG9yIG9mIHByb2IuIG9mIG5ldCB1c2UKCnByb2JfYmVkbmV0X3VzZWQgPC0gcGxvZ2lzKGxvZ2l0X3BfbmV0KSAgICAgICAgICAgICAgICAgICAgICMgcHJvYi4gb2YgbmV0IHVzZQoKYmVkbmV0X3VzZWQgICAgICA8LSByYmlub20obiwgMSwgcHJvYl9iZWRuZXRfdXNlZCkgICAgICAgICAgIyBhY3R1YWwgbmV0IHVzZQoKaG91c2Vfc2FtcGxlZCAgICA8LSBiZWRuZXRfdXNlZCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIyBob3VzZSBzYW1wbGVkIHdoZXJlIG5ldHMgdXNlZApgYGA=ECODDECNEF

At average temperature and mosquito pressure (`tz = mz = 0`), **−1 is the logit of net-use probability**, corresponding to **26.9% net use**.

Heat reduces net use (`-1.25 * tz`); mosquito nuisance increases it (`+1.75 * mz`).

Actual bed net *use* for each house-night is drawn from a binomial process.
</div>

<aside class="notes"><p>The variables <code>tz</code> and <code>mz</code> are standardised temperature and pressure. When both are zero, the predictor equals the intercept, $-1 = log(p / (1 - p))$. The inverse-logit gives $p = plogis(-1) = 0.269$. <strong>This is the conditional probability at both predictors’ means, not the average probability across all houses;</strong> the inverse-logit is nonlinear.</p>
<p>The coefficients describe <strong>changes in log odds for one-SD predictor increases,</strong> holding the other predictor fixed. <code>rbinom</code> draws actual net use, not net ownership or allocation.</p>
<p>The final line implements the sampling rule exactly.</p>
</aside></script></section><section data-separator="?

Each attacker has a **70% chance of entering**. Unsampled records remain **NA**.
</div>

<aside class="notes"><p>This is the measurement rule in <code>R/01_simulate.R</code>.</p>
<p>Conditional on $N$ attackers, the count is <code>Binomial(N, p)</code>, with <code>p = bed_net_entry_rate = 0.7</code>: mean <code>Np</code> and variance <code>Np(1-p)</code>. Zero attackers imply zero captures, and captures cannot exceed attackers. <strong>The probability is illustrative and constant across houses and temperatures.</strong></p>
<p>We assume independent entry and that every entrant remains inside and is counted. This adds capture variation relative to perfect counting, not necessarily more variance than the previous Poisson measurement model.</p>
</aside></script></section><section data-separator="?

<p><strong>Raising the intercept increases each house&#39;s net-use probability but also changes which houses are represented; it does not merely increase sample size.</strong></p>
<p>Both parents still influence selection, so changing <strong>the intercept does not remove the collider path.</strong></p>

## 4. Lower baseline use makes inclusion more unequal

At average temperature ($T\_z=0$), compare average pressure ($M\_z=0$) with very high pressure ($M\_z=4$).

$$ \\Pr(U = 1 \\mid T\_z, M\_z) = \\operatorname{logit}^{-1} (\\alpha - 1.25T\_z + 1.75M\_z) \\\\ p\_0=\\operatorname{logit}^{-1}(\\alpha), \\qquad p\_4=\\operatorname{logit}^{-1}(\\alpha+7) $$

| $\\alpha$ | Net use at $M\_z=0$ ($p\_0$) | Net use at $M\_z=4$ ($p\_4$) | Relative increase |
|---------:|---------------------------:|---------------------------:|------------------:|
| −1       | 26.89%                     | 99.75%.                    | **+271%**         |
| −5       | 0.669%                     | 88.08%                     | **+13,060%**      |
| −10      | 0.00454%                   | 4.743%                     | **+104,367%**     |

Relative increase = $100(p\_4-p\_0)/p\_0$.
Calculated probabilities at fixed temperature, not simulation averages.
<!-- .element: class="caption" -->

> [!evidence]
> Lower baseline use reduces inclusion in both groups, but increases the relative sampling advantage of high-pressure house-nights.
</div>

<aside class="notes"><p>Read the table in two directions. Down each probability column, lowering alpha makes net use less likely at either pressure level. Across each row, high pressure makes net use more likely. The final column shows that this relative advantage grows sharply as alpha falls.</p>
<p>The relative increase is $100 × (p_4 − p_0) / p_0$, not the difference between two percentages expressed in percentage points. An increase of 271% means a probability 3.71 times as large, not 2.71 times. The corresponding probability ratios are approximately 3.71, 131.60, and 1,044.67. Calculate these from unrounded probabilities.</p>
<p>The nuisance coefficient remains 1.75 throughout. A four-SD pressure increase therefore multiplies the odds of net use by <code>exp(7)</code> in every row. However, a constant odds ratio does not imply a constant probability ratio. When use is already likely, probabilities approach their ceiling of one; when baseline use is very low, high pressure can confer a much larger relative advantage in inclusion.</p>
<p>These two pressure levels illustrate the mechanism; they are not the only levels present in the population. Actual sample composition also depends on how many house-nights occur at each pressure and temperature. The simulation averages over that complete distribution.</p>
<p><strong>A smaller random sample would not systematically have higher mean pressure. Here, mean pressure increases because the reduction in sampling is selective, not merely because fewer records remain.</strong></p>
<p><strong>The ecological population remains the same.</strong></p>
</aside></script></section></section><section ><section data-separator="?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: start; justify-content: center" absolute="true">

## Temperature effect on pressure

FENCEDCODEr:1:YGBgcgp0ZW1wZXJhdHVyZV9lZmZlY3QgPC0gMC4zICAjIGJldGEKCm4gPC0gNjAwMEwKCmFpcl90ZW1wZXJhdHVyZV9jIDwtIHJub3JtKG4sIG1lYW4gPSAyNywgc2QgPSAyLjgpCnR6IDwtIGFzLm51bWVyaWMoc2NhbGUoYWlyX3RlbXBlcmF0dXJlX2MpKSAgIyBzdGFuZGFyZGlzZWQgdGVtcGVyYXR1cmUgKGFzIGJlZm9yZSkKClogPC0gcm5vcm0obiwgbWVhbiA9IDAsIHNkID0gMC42NSkgICMgcmFuZG9tIGVmZmVjdHMgaW4gaG91c2UtbmlnaHQgbG9nIGV4cGVjdGVkIHByZXNzdXJlCmxvZ19wcmVzc3VyZSA8LSBsb2coMjgpICsgdGVtcGVyYXR1cmVfZWZmZWN0ICogdHogKyBaICAjIHRlbXBlcmF0dXJlLWRlcGVuZGVudCBsb2cobGFtYmRhKQoKdHJ1ZV9hdHRhY2tpbmdfbW9zcXVpdG9lcyA8LSBycG9pcyhuLCBsYW1iZGEgPSBleHAobG9nX3ByZXNzdXJlKSkgICMgcmVhbGlzZWQgaG91c2UtbmlnaHQgcHJlc3N1cmUKbXogPC0gYXMubnVtZXJpYyhzY2FsZSh0cnVlX2F0dGFja2luZ19tb3NxdWl0b2VzKSkgICMgc3RhbmRhcmRpc2VkIHJlYWxpc2VkIHByZXNzdXJlCgpwcm9iX2JlZG5ldF91c2VkIDwtIHBsb2dpcygtMSAtIDEuMjUgKiB0eiArIDEuNzUgKiBteikgICMgcHJvYmFiaWxpdHkgb2YgbmV0IHVzZQpgYGA=ECODDECNEF

$N\\mid T\_z,Z \\sim \\operatorname{Poisson}(\\lambda)$, so $E[N\\mid T\_z,Z]=\\lambda$.

$\\log(\\lambda)=\\log(28)+\\beta T\_z+Z$, $Z\\sim\\mathcal{N}(0,0.65^2)$, $Z\\perp T\_z$.

$Z$: house-night heterogeneity in log expected pressure, independent of temperature.

A one-SD increase in temperature—one unit of `tz`—multiplies expected mosquito pressure by $e^\\beta$; $\\beta=0.3$ gives approximately **×1.35, or a 35% increase**.
</div>

<aside class="notes"><p>This slide adds a direct ecological effect of temperature while retaining the behavioural filter introduced earlier. Follow the generating sequence: generate temperature; standardise it; generate expected mosquito pressure from temperature and independent house-night heterogeneity; draw the actual number of attackers; standardise those counts; then calculate the probability of net use.</p>
<p>$N$ is the actual number of attacking mosquitoes in a house-night. $\lambda$ is its conditional expected value, given standardised temperature and the house-night effect $Z$. The Poisson draw generates an integer count around that expectation; the realised count need not equal $\lambda$.</p>
<p><strong>$Z$ is a random house-night effect on log expected mosquito pressure, not a standardised score.</strong> The code draws one value per house-night from a normal distribution with mean zero and standard deviation 0.65. <strong>It represents ecological heterogeneity not explained by temperature.</strong> Positive values increase expected pressure and negative values decrease it. In this toy model, these effects are generated independently of temperature. This is an assumption, not a claim that all unmeasured influences on mosquito pressure would be independent of temperature in a real study.</p>
<p>The equation can also be read as $\lambda=28\times e^{\beta T_z}\times e^Z$. Temperature and house-night heterogeneity act additively on log expected pressure and multiplicatively on expected pressure. The normal draw introduces differences in expected pressure among house-nights, while the subsequent Poisson draw introduces variation in actual attacker counts around those expectations. These are ecological components of the simulation, not the later process of mosquito entry into a net.</p>
<p><strong>Interpret $\beta$ on the correct response scale.</strong> A one-standard-deviation increase in temperature corresponds to a one-unit increase in <code>tz</code>. Holding $Z$ fixed, it multiplies expected attacker count by $e^\beta$. With $\beta=0.3$, the multiplier is approximately 1.35: a 35% increase in expected mosquito pressure. It is not an increase of 1.35 standard deviations in <code>mz</code>, nor a guarantee that two individual house-nights differ by exactly 35%.</p>
<p>The same multiplier holds after averaging over the independent distribution of $Z$: $E[N\mid T_z]=28\exp(\beta T_z+0.65^2/2)$. At average temperature, the expected count is therefore approximately 34.6, not 28. The value 28 is the conditional expectation when both $T_z=0$ and $Z=0$; it is also the median of the distribution of $\lambda$ at $T_z=0$, not necessarily the median of the realised mosquito counts.</p>
<p><code>mz</code> is calculated only after generating the attacker counts. It expresses those counts in standard-deviation units for the behavioural filter; it does not change the response scale of the ecological model. The same temperature variable now enters two different processes: $\beta$ changes log expected mosquito pressure, whereas −1.25 changes the log odds of net use. Their coefficients are not directly comparable because their response scales differ.</p>
<p>The final line computes net-use probabilities only. Actual net use, selection, and captured counts are generated in subsequent steps. Standardisation uses the complete generated population before selection and is not recalculated within the selected sample.</p>
<p><strong>The teaching question is whether selective observation recovers or distorts an ecological relationship that now genuinely exists in the simulated world.</strong> The ecological coefficient $\beta$ is not the fitted linear count–temperature slope shown in the subsequent comparisons.</p>
</aside></script></section><section data-separator="?

200 populations per effect; slopes in mosquitoes per °C. <!-- .element: class="caption" -->

<aside class="notes"><p><code>R/04_discussion.R</code> generates all results without pre-computed data. <code>generate_ecological_population()</code> calculates <code>tz = as.numeric(scale(air_temperature_c))</code>, draws <code>Z = rnorm(n, 0, 0.65)</code>, and uses <code>log_pressure = log(28) + temperature_effect * tz + Z</code>, followed by Poisson counts and the existing net-use model. <code>mz</code> is calculated from the realised attackers before selection.</p>
<p>The first output illustrates an additional realisation; the table summarises the 200 seeded replicates.</p>
<p>Difference = selected slope − universal slope within the same replicate.</p>
<p>Results are exported to <code>data/ecological_replicates.csv</code> and <code>data/ecological_summary.csv</code>. The replicate file also contains <code>expected_universal</code>, the expected universal OLS count slope conditional on that population&#39;s temperatures, integrated over ecological heterogeneity and capture.</p>
<p>A negative universal slope and positive selected slope illustrate reversal; the selected regression alone cannot establish a new causal effect.</p>
</aside></script></section></section><section data-separator="?

TAKE-HOME MESSAGE <!-- .element: class="eyebrow" -->
## Distinguish the ecological and observational processes

1. Specify the ecological question and its causal assumptions.
2. Map the process that determines which observations are available.
3. Check whether selection depends on both exposure and outcome causes.

> [!warning]
> A sample of net users does not automatically represent all houses.
</div>

<aside class="notes"><p>Connect these messages to the participants’ fieldwork examples.</p>
<p>Colliders are properties of paths in a causal graph; an association alone cannot identify the selection mechanism.</p>
</aside></script></section><section data-separator="?

<!-- .slide: class="takeaway-slide" -->

Designing a more informative study <!-- .element: class="eyebrow" -->
## How could we measure mosquito pressure independently of residents’ decisions to use nets?

1. Consider sampling house-nights irrespective of net use, with a measurement method that works in both groups.
2. Record net use and the reasons observations are missing.

> [!evidence]
> Observing net use helps diagnose selection but does not, by itself, identify the missing mosquito counts or guarantee an unbiased causal estimate.
</div>

<aside class="notes"><p>The design goal is to break the dependence of observation on the behavioural collider.</p>
<p>Ask participants to propose and assess an appropriate entomological measurement method; this deck does not validate a specific device.</p>
</aside></script></section><section data-separator="?

**A shared cause can create an association.**

Season may affect both temperature and mosquito pressure, even without a direct temperature effect.

<aside class="notes"><p>The toy models isolate selected mechanisms; <strong>they are not complete causal accounts of mosquito ecology or observation.</strong></p>
<p><strong>Season represents seasonal processes that may jointly influence air temperature and mosquito pressure. This common-cause pathway can produce a population association even without a direct temperature effect on pressure.</strong></p>
<p><strong>Temperature may also affect mosquito behaviour and the probability of entering a net</strong>, as discussed in the next slide. If entry probability varies with temperature, recorded counts can depend on temperature even under universal coverage and without a temperature effect on attacking abundance.</p>
<p><strong>Universal coverage removes the net-use selection mechanism in the toy model; it does not remove seasonal confounding or temperature-dependent capture.</strong></p>
<p>A realistic analysis should specify relevant seasonal processes and time scales, investigate capture efficiency across temperatures, and assess these pathways using field knowledge, calibration data, and sensitivity analyses. Question 6 adds a direct ecological effect but still omits these two pathways.</p>
<p>None of the simulation results establishes whether these omitted effects are present or how large they are in the field.</p>
</aside></script></section><section data-separator="?

<aside class="notes"><p>This combines the mechanisms explored separately in the presentation.</p>
<p>Season is a common cause of temperature and mosquito pressure.</p>
<p>The T → M arrow represents the direct ecological effect to investigate; its presence and magnitude are not established here, and the zero-effect model omits it.</p>
